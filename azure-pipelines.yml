name: $(Date:yyyyMMdd).$(Rev:r)

trigger:
  branches:
    include:
      - dev
      - main
      - master

pr:
  branches:
    include:
      - dev
      - main
      - master

variables:
  - name: IMAGE_NAME
    value: ehte_backend

stages:
  # =========================
  # PR → DEV : CI ONLY
  # =========================
  - stage: CI_DEV
    displayName: "CI (PR → dev)"
    condition: and(eq(variables['Build.Reason'], 'PullRequest'), eq(variables['System.PullRequest.TargetBranchName'], 'dev'))

    jobs:
      - job: build
        pool:
          name: pitron-dev

        steps:
          - checkout: self
            clean: true

          - task: NodeTool@0
            inputs:
              versionSpec: "22.x"
            displayName: "Use Node 22"

          - script: |
              set -e
              npm ci
              export DATABASE_URL="postgresql://placeholder:placeholder@localhost:5432/placeholder"
              npx prisma generate --schema=./prisma/schema
              npm run type-check
              npm run build
            displayName: "Install, Prisma generate & Build"

  # =========================
  # MERGE → DEV : CD DEV
  # =========================
  - stage: CD_DEV
    displayName: "CD (dev)"
    condition: and(ne(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))

    variables:
      - group: Ehte-registry-dev

    jobs:
      - job: build_push
        displayName: "Build & Push"

        pool:
          name: pitron-dev

        steps:
          - checkout: self
            clean: true

          - script: |
              set -e

              echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" \
              -u "$REGISTRY_USER" --password-stdin

              docker build --pull --no-cache \
              -t "$REGISTRY_HOST/$IMAGE_NAME:dev-latest" .

              docker push "$REGISTRY_HOST/$IMAGE_NAME:dev-latest"

            displayName: "Build & Push (dev)"

            env:
              REGISTRY_HOST: $(REGISTRY_HOST)
              REGISTRY_USER: $(REGISTRY_USER)
              REGISTRY_PASSWORD: $(REGISTRY_PASSWORD)
              IMAGE_NAME: $(IMAGE_NAME)

      - job: deploy_dev
        displayName: "Deploy"
        dependsOn: build_push

        pool:
          name: pitron-dev

        steps:
          - checkout: self
            clean: true

          - task: DownloadSecureFile@1
            name: envFile
            displayName: "Download ehte-dev.env"
            inputs:
              secureFile: "ehte-dev.env"

          - script: |
              set -e

              cp "$(envFile.secureFilePath)" "$(Build.SourcesDirectory)/.env"
              chmod 600 "$(Build.SourcesDirectory)/.env"

              # Strip invalid dotenv lines (keys with spaces) if present.
              sed -i '/^IMAP Port=/d;/^POP3 Port=/d;/^SMTP Port=/d' "$(Build.SourcesDirectory)/.env"

              echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" \
              -u "$REGISTRY_USER" --password-stdin

              SHARED_MINIO_NETWORK="$(
                docker inspect shared-minio -f '{{range $k, $v := .NetworkSettings.Networks}}{{println $k}}{{end}}' \
                | sed '/^$/d' | grep -v '^bridge$' | head -1
              )"
              if [ -z "$SHARED_MINIO_NETWORK" ]; then
                SHARED_MINIO_NETWORK="$(
                  docker inspect shared-minio -f '{{range $k, $v := .NetworkSettings.Networks}}{{println $k}}{{end}}' \
                  | sed '/^$/d' | head -1
                )"
              fi
              if [ -z "$SHARED_MINIO_NETWORK" ]; then
                echo "Could not find docker network for shared-minio — aborting (will not create a new MinIO)."
                exit 1
              fi
              echo "Using shared-minio network: $SHARED_MINIO_NETWORK"
              export SHARED_MINIO_NETWORK

              if [ "$SHARED_MINIO_NETWORK" = "bridge" ]; then
                export MINIO_ENDPOINT=host.docker.internal
                export MINIO_PORT=9100
              else
                export MINIO_ENDPOINT=shared-minio
                export MINIO_PORT=9000
              fi

              ENV_FILE="$(Build.SourcesDirectory)/.env"
              POSTGRES_USER="$(grep -E '^POSTGRES_USER=' "$ENV_FILE" | tail -1 | cut -d= -f2- | tr -d '\r' | sed 's/^["'\'']//;s/["'\'']$//')"
              POSTGRES_PASSWORD="$(grep -E '^POSTGRES_PASSWORD=' "$ENV_FILE" | tail -1 | cut -d= -f2- | tr -d '\r' | sed 's/^["'\'']//;s/["'\'']$//')"
              POSTGRES_DB="$(grep -E '^POSTGRES_DB=' "$ENV_FILE" | tail -1 | cut -d= -f2- | tr -d '\r' | sed 's/^["'\'']//;s/["'\'']$//')"
              POSTGRES_USER="${POSTGRES_USER:-ehte_user}"
              POSTGRES_DB="${POSTGRES_DB:-ehte_db}"
              if [ -z "$POSTGRES_PASSWORD" ]; then
                echo "POSTGRES_PASSWORD is empty in ehte-dev.env — aborting (will not touch other databases)."
                exit 1
              fi
              export POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB
              export DATABASE_URL="$(python3 -c 'import os, urllib.parse; u=os.environ["POSTGRES_USER"]; p=urllib.parse.quote(os.environ["POSTGRES_PASSWORD"], safe=""); d=os.environ["POSTGRES_DB"]; print("postgresql://%s:%s@ehte_postgres-dev:5432/%s?sslmode=disable" % (u, p, d))')"
              export DIRECT_URL="$DATABASE_URL"
              echo "Using dedicated ehte_postgres-dev (not host/database placeholder, not other postgres containers)."

              # Recreate the API only. Leave ehte_postgres-dev, shared-minio, and ehte_admin-dev running.
              docker rm -f ehte_backend-dev 2>/dev/null || true

              docker compose -f docker-compose.yml pull
              docker compose -f docker-compose.yml up -d

              docker ps --filter name=ehte_backend-dev --filter name=ehte_postgres-dev --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'

            displayName: "Deploy (dev)"

            env:
              REGISTRY_HOST: $(REGISTRY_HOST)
              REGISTRY_USER: $(REGISTRY_USER)
              REGISTRY_PASSWORD: $(REGISTRY_PASSWORD)
              IMAGE_NAME: $(IMAGE_NAME)

  # =========================
  # PR → MAIN/MASTER : CI ONLY
  # =========================
  - stage: CI_PROD
    displayName: "CI (PR → main)"
    condition: and(eq(variables['Build.Reason'], 'PullRequest'), or(eq(variables['System.PullRequest.TargetBranchName'], 'main'), eq(variables['System.PullRequest.TargetBranchName'], 'master')))

    jobs:
      - job: build
        pool:
          name: pitron-dev

        steps:
          - checkout: self
            clean: true

          - task: NodeTool@0
            inputs:
              versionSpec: "22.x"
            displayName: "Use Node 22"

          - script: |
              set -e
              npm ci
              export DATABASE_URL="postgresql://placeholder:placeholder@localhost:5432/placeholder"
              npx prisma generate --schema=./prisma/schema
              npm run type-check
              npm run build
            displayName: "Install, Prisma generate & Build"

  # =====================
  # MERGE → MAIN : CD PROD
  # (build & push only — prod deploy is not split onto another host yet)
  # =====================
  - stage: CD_PROD
    displayName: "CD (prod)"
    condition: and(ne(variables['Build.Reason'], 'PullRequest'), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/master')))

    variables:
      - group: Ehte-registry-dev

    jobs:
      - job: build_push
        displayName: "Build & Push"

        pool:
          name: pitron-dev

        steps:
          - checkout: self
            clean: true

          - script: |
              set -e

              echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" \
              -u "$REGISTRY_USER" --password-stdin

              docker build --pull --no-cache \
                -t "$REGISTRY_HOST/$IMAGE_NAME:prod-latest" \
                -t "$REGISTRY_HOST/$IMAGE_NAME:prod-$(Build.BuildId)" .

              docker push "$REGISTRY_HOST/$IMAGE_NAME:prod-latest"
              docker push "$REGISTRY_HOST/$IMAGE_NAME:prod-$(Build.BuildId)"

            displayName: "Build & Push (prod)"

            env:
              REGISTRY_HOST: $(REGISTRY_HOST)
              REGISTRY_USER: $(REGISTRY_USER)
              REGISTRY_PASSWORD: $(REGISTRY_PASSWORD)
              IMAGE_NAME: $(IMAGE_NAME)
