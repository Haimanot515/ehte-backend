services:
  minio:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: ehte-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY not set}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY not set}
    ports:
      - "9010:9000"
      - "9011:9001"  # TODO: restrict via Azure NSG to your IP/VPN — do not leave open to 0.0.0.0/0
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  createbuckets:
    image: minio/mc:RELEASE.2025-08-13T08-44-29Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY not set}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY not set}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:?MINIO_BUCKET_NAME not set}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \$MINIO_ROOT_USER \$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing local/\$MINIO_BUCKET_NAME;
      exit 0;
      "
    restart: "no"

  app:
    image: ${REGISTRY_HOST}/${IMAGE_NAME:-ehte_backend}:${IMAGE_TAG:-dev-latest}
    container_name: ehte_backend
    restart: unless-stopped
    ports:
      - "3009:3000"
    env_file:
      - .env
    depends_on:
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

volumes:
  minio_data: