# ============================================================
# Ehte Backend — DEV API only
# Azure checkout on ecs-a447. Project name is pinned so the
# Azure dir "s" cannot collide with other stacks.
#
# API-only. Does NOT start Postgres, Redis, or MinIO.
# Secrets come from .env (secure file ehte-dev.env).
# Nest reads MINIO_ENDPOINT / MINIO_PORT (not *_DOCKER), so
# those are set here. The deploy job attaches this service to
# shared-minio's existing Docker network (SHARED_MINIO_NETWORK).
# ============================================================
name: ehte_backend-dev

services:
  api:
    image: ${REGISTRY_HOST:-images.pitrontech.et}/ehte_backend:dev-latest
    container_name: ehte_backend-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_URL: https://api.eheta.dev.pitrontech.et
      ADMIN_APP_URL: https://admin.eheta.dev.pitrontech.et
      # App Joi schema requires these names. Env file only has *_DOCKER.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-shared-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:4430:3000"
    networks:
      - default
      - shared_minio

networks:
  shared_minio:
    external: true
    name: ${SHARED_MINIO_NETWORK:?SHARED_MINIO_NETWORK must be the docker network of shared-minio}
