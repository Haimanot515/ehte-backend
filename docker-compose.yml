name: ehte_backend-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: ehte_postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ehte_db}
      POSTGRES_USER: ${POSTGRES_USER:-ehte_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in ehte-dev.env}
    volumes:
      - ehte_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ehte_user} -d ${POSTGRES_DB:-ehte_db}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - default

  redis:
    image: redis:7-alpine
    container_name: ehte_redis-dev
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in ehte-dev.env}"]
    volumes:
      - ehte_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - default

  api:
    image: ${REGISTRY_HOST:-images.pitrontech.et}/ehte_backend:dev-latest
    container_name: ehte_backend-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_URL: https://api.eheta.dev.pitrontech.et
      ADMIN_APP_URL: https://admin.eheta.dev.pitrontech.et
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL:-${DATABASE_URL}}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-shared-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: "false"
      # Dev only: plain redis on the private docker network, do not copy to production
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: "0"
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
      REDIS_SECURITY_URL: redis://default:${REDIS_PASSWORD}@redis:6379/1
      REDIS_ALLOW_INSECURE: "true"
      REDIS_ALLOW_PLAINTEXT: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:4430:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - shared_minio

networks:
  shared_minio:
    external: true
    name: ${SHARED_MINIO_NETWORK:?SHARED_MINIO_NETWORK must be the docker network of shared-minio}

volumes:
  ehte_postgres_data:
    name: ehte_postgres_data
  ehte_redis_data:
    name: ehte_redis_data