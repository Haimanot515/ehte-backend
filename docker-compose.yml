services:
  minio:
    image: minio/minio:latest
    container_name: ehte-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ${REGISTRY_HOST}/${IMAGE_NAME:-ehte_backend}:${IMAGE_TAG:-dev-latest}
    container_name: ehte_backend
    restart: unless-stopped
    ports:
      - "3009:3000"
    env_file:
      - ehte.env
    depends_on:
      minio:
        condition: service_healthy

volumes:
  minio_data: